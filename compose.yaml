# OCSO — single-host deployment with Docker Compose (docs/13 §2,
# docs/operations/compose.md).
#
#   docker compose up -d                  # keygen → postgres + audit-db → migrate → api/worker → web
#   open http://localhost:3000            # first run: /setup with the token from `docker compose logs api`
#
# Optional profiles (combine freely):
#   demo           Meridian Bank demo: example MCP server + one-shot seed.
#                  OCSO_DEMO_SEED=true docker compose --profile demo up -d
#   observability  OTel Collector + Jaeger (UI on 127.0.0.1:16686).
#                  OTEL_ENABLED=true docker compose --profile observability up -d
#   s3             SeaweedFS S3-compatible blob store instead of the local volume (ADR-011).
#                  BLOB_DRIVER=s3 docker compose --profile s3 up -d
#
# Scale agent workers: docker compose up -d --scale worker=3
# Settings: copy .env.example to .env (every setting has a safe default).
# Secrets: generated once by `keygen` into the `secrets` volume — never in this
# file or in git. BACK UP that volume together with PostgreSQL (pgdata and the
# audit store's auditdata).
name: ocso

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Hardening shared by the long-running OCSO containers.
x-hardening: &hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

x-api-image: &api-image
  image: ${OCSO_IMAGE_PREFIX:-ocso}/api:${OCSO_VERSION:-local}
  build:
    context: .
    target: api
    args:
      APP_VERSION: ${OCSO_VERSION:-local}

x-migrate-image: &migrate-image
  image: ${OCSO_IMAGE_PREFIX:-ocso}/migrate:${OCSO_VERSION:-local}
  build:
    context: .
    target: migrate
    args:
      APP_VERSION: ${OCSO_VERSION:-local}

# Each OCSO container mounts only the `app` sub-directory of the secrets volume.
x-app-secrets: &app-secrets
  type: volume
  source: secrets
  target: /run/secrets/ocso
  read_only: true
  volume:
    subpath: app
    nocopy: true

x-db-env: &db-env
  # A non-empty DATABASE_URL (e.g. managed PostgreSQL) overrides the generated one.
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_URL_FILE: /run/secrets/ocso/database_url
  DATABASE_SSL: ${DATABASE_SSL:-false}

# The audit store (ADR-032): a separate database, the system of record for audit
# events. `postgres` = the audit-db service below; `clickhouse` = set CLICKHOUSE_*.
# The worker holds the writer credentials (INSERT/SELECT), the api the reader's
# (SELECT only); each service below points AUDIT_DATABASE_URL_FILE at its own.
x-audit-env: &audit-env
  AUDIT_DRIVER: ${AUDIT_DRIVER:-postgres}
  AUDIT_DATABASE_SSL: ${AUDIT_DATABASE_SSL:-false}
  AUDIT_DATABASE_POOL_SIZE: ${AUDIT_DATABASE_POOL_SIZE:-5}
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ocso_audit}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_PASSWORD_FILE: ${CLICKHOUSE_PASSWORD_FILE:-}
  # Ed25519 key signing checkpoints, exports and exception reports (generated by keygen).
  AUDIT_SIGNING_KEY_FILE: /run/secrets/ocso/audit_signing_key
  # After rotating the signing key: the retired public keys (PEM bundle) older checkpoints verify against.
  AUDIT_TRUSTED_PUBLIC_KEYS_FILE: ${AUDIT_TRUSTED_PUBLIC_KEYS_FILE:-}
  AUDIT_STORE_TIMEOUT_MS: ${AUDIT_STORE_TIMEOUT_MS:-15000}

x-server-env: &server-env
  <<: [*db-env, *audit-env]
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${OCSO_VERSION:-local}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
  QUEUE_DRIVER: postgres
  DEPLOYMENT_DRIVER: compose
  OCSO_PUBLIC_URL: ${OCSO_PUBLIC_URL:-http://localhost:3000}
  # Secrets (ADR-012): local envelope store; the KEK is read from the file.
  SECRETS_DRIVER: local
  OCSO_SECRETS_MASTER_KEY_FILE: /run/secrets/ocso/master_key
  # Blobs (ADR-011): `local` = the `blobs` volume; `s3` = SeaweedFS (s3 profile) or
  # any S3 endpoint you set here.
  BLOB_DRIVER: ${BLOB_DRIVER:-local}
  BLOB_LOCAL_DIR: /var/lib/ocso/blobs
  BLOB_SIGNING_KEY: ${BLOB_SIGNING_KEY:-}
  BLOB_SIGNING_KEY_FILE: /run/secrets/ocso/blob_signing_key
  S3_BUCKET: ${S3_BUCKET:-ocso-media}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_SHARED_CREDENTIALS_FILE: ${AWS_SHARED_CREDENTIALS_FILE:-/run/secrets/ocso/aws_credentials}
  # Development-only scripted model provider (ADR-015). The demo seed implies it;
  # the production guard in @ocso/config needs the explicit allow flag too.
  OCSO_ENABLE_DEV_PROVIDERS: ${OCSO_ENABLE_DEV_PROVIDERS:-${OCSO_DEMO_SEED:-false}}
  OCSO_ALLOW_DEV_PROVIDERS_IN_PRODUCTION: ${OCSO_ALLOW_DEV_PROVIDERS_IN_PRODUCTION:-${OCSO_DEMO_SEED:-false}}
  # Transactional email: invites, password resets, sign-in codes, alert emails
  # (docs/operations/compose.md §9). Until EMAIL_DRIVER is resend or smtp, email
  # only reaches the api/worker log (a trial starts without it); Settings → Email
  # and the logs warn that invites and resets are not delivered. Set
  # EMAIL_ALLOW_LOG_IN_PRODUCTION=false to make missing email a start-up error. Keys never go in this file: set
  # RESEND_API_KEY_FILE / SMTP_PASSWORD_FILE to a file on the secrets volume
  # (/run/secrets/ocso/...); the entrypoint resolves them. A non-empty value wins.
  EMAIL_DRIVER: ${EMAIL_DRIVER:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  EMAIL_ALLOW_LOG_IN_PRODUCTION: ${EMAIL_ALLOW_LOG_IN_PRODUCTION:-true}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_API_KEY_FILE: ${RESEND_API_KEY_FILE:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_PASSWORD_FILE: ${SMTP_PASSWORD_FILE:-}
  # OpenTelemetry export (observability profile runs the collector).
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  # ── one-shot: create missing secrets on the `secrets` volume ────────────────
  keygen:
    <<: *migrate-image
    command: ["node", "/opt/ocso/keygen.mjs"]
    # Root only to chown files for postgres (root-read) and the app user (1000).
    user: "0:0"
    network_mode: none
    volumes:
      - secrets:/secrets
      - ./infra/compose/keygen.mjs:/opt/ocso/keygen.mjs:ro
    restart: "no"
    logging: *logging

  postgres:
    image: ${OCSO_POSTGRES_IMAGE:-postgres:18.6}
    environment:
      POSTGRES_USER: ocso
      POSTGRES_DB: ocso
      POSTGRES_PASSWORD_FILE: /run/secrets/ocso-db/db_password
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount
      # the parent (NOT …/data) so major upgrades can use pg_upgrade --link.
      - pgdata:/var/lib/postgresql
      - type: volume
        source: secrets
        target: /run/secrets/ocso-db
        read_only: true
        volume:
          subpath: postgres
          nocopy: true
    depends_on:
      keygen:
        condition: service_completed_successfully
    networks: [backend]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocso -d ocso -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  # The audit store's database (ADR-032): a separate server, so the application's own
  # database credentials never reach it. The worker connects as a writer role with
  # INSERT/SELECT only, the api as a SELECT-only reader; BACK UP `auditdata` like `pgdata`.
  audit-db:
    image: ${OCSO_POSTGRES_IMAGE:-postgres:18.6}
    environment:
      POSTGRES_USER: ocso_audit
      POSTGRES_DB: ocso_audit
      POSTGRES_PASSWORD_FILE: /run/secrets/ocso-audit-db/db_password
    volumes:
      - auditdata:/var/lib/postgresql
      - type: volume
        source: secrets
        target: /run/secrets/ocso-audit-db
        read_only: true
        volume:
          subpath: audit-postgres
          nocopy: true
    depends_on:
      keygen:
        condition: service_completed_successfully
    networks: [backend]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocso_audit -d ocso_audit -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    restart: unless-stopped
    logging: *logging

  # ── one-shot: explicit migration step (docs/13 §5) ───────────────────────────
  # Also provisions the audit store (packages/audit-store audit-migrate): its schema, the
  # writer and reader roles and the minimum retention, with owner credentials only this step
  # holds (secrets subpath audit-migrate).
  migrate:
    <<: *migrate-image
    environment:
      <<: [*db-env, *audit-env]
      AUDIT_DATABASE_OWNER_URL: ${AUDIT_DATABASE_OWNER_URL:-}
      AUDIT_DATABASE_OWNER_URL_FILE: /run/secrets/ocso-audit-migrate/audit_owner_url
      # Non-empty values (e.g. a managed database) override the generated ones.
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:-}
      AUDIT_DATABASE_URL_FILE: /run/secrets/ocso-audit-migrate/audit_writer_url
      AUDIT_READER_URL: ${AUDIT_READER_URL:-}
      AUDIT_READER_URL_FILE: /run/secrets/ocso-audit-migrate/audit_reader_url
      AUDIT_WRITER_PASSWORD: ${AUDIT_WRITER_PASSWORD:-}
      AUDIT_WRITER_PASSWORD_FILE: /run/secrets/ocso-audit-migrate/audit_writer_password
      AUDIT_READER_PASSWORD: ${AUDIT_READER_PASSWORD:-}
      AUDIT_READER_PASSWORD_FILE: /run/secrets/ocso-audit-migrate/audit_reader_password
      # The store's own minimum retention: no purge removes anything younger (≥ 365; e.g. 2555 for 7 years).
      AUDIT_MIN_RETENTION_DAYS: ${AUDIT_MIN_RETENTION_DAYS:-365}
      AUDIT_ALLOW_OWNER_WRITER: ${AUDIT_ALLOW_OWNER_WRITER:-false}
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:-}
      # false when a DBA created the writer role/user (managed databases): only grants are applied.
      AUDIT_PROVISION_ROLE: ${AUDIT_PROVISION_ROLE:-true}
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:-}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-}
      CLICKHOUSE_ADMIN_PASSWORD_FILE: ${CLICKHOUSE_ADMIN_PASSWORD_FILE:-}
      CLICKHOUSE_PURGE_USER: ${CLICKHOUSE_PURGE_USER:-}
      CLICKHOUSE_PURGE_PASSWORD: ${CLICKHOUSE_PURGE_PASSWORD:-}
      CLICKHOUSE_PURGE_PASSWORD_FILE: ${CLICKHOUSE_PURGE_PASSWORD_FILE:-}
    volumes:
      - *app-secrets
      - type: volume
        source: secrets
        target: /run/secrets/ocso-audit-migrate
        read_only: true
        volume:
          subpath: audit-migrate
          nocopy: true
    depends_on:
      postgres:
        condition: service_healthy
      audit-db:
        condition: service_healthy
    networks: [backend]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *logging

  api:
    <<: [*api-image, *hardening]
    environment:
      <<: *server-env
      PORT: 4000
      OTEL_SERVICE_NAME: ocso-api
      # The audit store's read-only reader (SELECT only): the api never writes to it.
      AUDIT_DATABASE_URL: ${AUDIT_READER_URL:-}
      AUDIT_DATABASE_URL_FILE: /run/secrets/ocso/audit_reader_url
      CLICKHOUSE_USER: ${CLICKHOUSE_READER_USER:-${CLICKHOUSE_USER:-}}
      CLICKHOUSE_PASSWORD: ${AUDIT_READER_PASSWORD:-${CLICKHOUSE_PASSWORD:-}}
      OCSO_SETUP_TOKEN: ${OCSO_SETUP_TOKEN:-}
      OCSO_SETUP_TOKEN_FILE: /run/secrets/ocso/setup_token
      TRUST_PROXY: "true"
      # Authentication (Better Auth, ADR-025; docs/operations/compose.md §2). The secret
      # comes from keygen; a non-empty BETTER_AUTH_SECRET wins. The API sets the
      # session cookie, so its Secure flag is configured here.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_SECRET_FILE: /run/secrets/ocso/better_auth_secret
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-24}
      # Extra trusted origins, e.g. an OIDC IdP on a private network (comma-separated).
      OCSO_AUTH_TRUSTED_ORIGINS: ${OCSO_AUTH_TRUSTED_ORIGINS:-}
      # Break-glass account recovery: set only while you need it, then remove it.
      OCSO_RECOVERY_TOKEN: ${OCSO_RECOVERY_TOKEN:-}
      OCSO_RECOVERY_TOKEN_FILE: ${OCSO_RECOVERY_TOKEN_FILE:-}
    volumes:
      - *app-secrets
      - blobs:/var/lib/ocso/blobs
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    # Not published: the web app proxies the public ingress paths to the API.
    # For direct access while debugging use infra/compose/debug.yaml.
    expose: ["4000"]
    networks: [backend, default]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    <<: *hardening
    image: ${OCSO_IMAGE_PREFIX:-ocso}/worker:${OCSO_VERSION:-local}
    build:
      context: .
      target: worker
      args:
        APP_VERSION: ${OCSO_VERSION:-local}
    environment:
      <<: *server-env
      HEALTH_PORT: 4100
      OTEL_SERVICE_NAME: ocso-worker
      # The audit store's writer (INSERT/SELECT), from a secrets subpath only the worker mounts.
      AUDIT_DATABASE_URL: ${AUDIT_DATABASE_URL:-}
      AUDIT_DATABASE_URL_FILE: /run/secrets/ocso-audit-writer/audit_database_url
      # clickhouse driver only: the user that drops partitions past retention (never the writer).
      CLICKHOUSE_PURGE_USER: ${CLICKHOUSE_PURGE_USER:-}
      CLICKHOUSE_PURGE_PASSWORD: ${CLICKHOUSE_PURGE_PASSWORD:-}
      CLICKHOUSE_PURGE_PASSWORD_FILE: ${CLICKHOUSE_PURGE_PASSWORD_FILE:-}
    volumes:
      - *app-secrets
      - type: volume
        source: secrets
        target: /run/secrets/ocso-audit-writer
        read_only: true
        volume:
          subpath: audit-writer
          nocopy: true
      - blobs:/var/lib/ocso/blobs
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      migrate:
        condition: service_completed_successfully
    # No published ports so replicas work. Two by default: if one dies, another takes over its
    # conversations when their leases expire. OCSO_WORKER_REPLICAS (or `--scale worker=N`) changes it.
    deploy:
      replicas: ${OCSO_WORKER_REPLICAS:-2}
    networks: [backend, default]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Time to finish or checkpoint in-flight turns and release leases (docs/10 §9).
    stop_grace_period: 90s
    restart: unless-stopped

  web:
    <<: *hardening
    image: ${OCSO_IMAGE_PREFIX:-ocso}/web:${OCSO_VERSION:-local}
    build:
      context: .
      target: web
      args:
        APP_VERSION: ${OCSO_VERSION:-local}
        # Baked into Next rewrites at build time; must match the runtime value.
        API_URL: http://api:4000
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      # Public origin: the Origin the BFF sends with cookie-bearing auth calls (ADR-025).
      OCSO_PUBLIC_URL: ${OCSO_PUBLIC_URL:-http://localhost:3000}
      # Reverse proxies in front of web (0 = published directly: X-Forwarded-For is ignored).
      OCSO_TRUSTED_PROXY_HOPS: ${OCSO_TRUSTED_PROXY_HOPS:-0}
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OCSO_HTTP_BIND:-0.0.0.0}:${OCSO_HTTP_PORT:-3000}:3000"
    networks: [default]
    healthcheck:
      # /login renders even when the API is down, so web health never depends on
      # the API. Each probe costs one /v1/setup/status call, hence 30s.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    stop_grace_period: 15s
    restart: unless-stopped

  # ── profile: demo ────────────────────────────────────────────────────────────
  mcp-bank-demo:
    profiles: [demo]
    image: ${OCSO_IMAGE_PREFIX:-ocso}/mcp-bank-demo:${OCSO_VERSION:-local}
    build:
      context: .
      dockerfile: examples/mcp-bank-demo/Dockerfile
    # The example server reads its bearer token from the environment only.
    entrypoint: ["/bin/sh", "-c", 'DEMO_MCP_TOKEN="$$(cat /run/secrets/demo/demo_mcp_token)" exec node dist/main.js']
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      # DNS-rebinding protection (hostnames): the service name plus loopback for the health probe.
      DEMO_ALLOWED_HOSTS: mcp-bank-demo,127.0.0.1,localhost
    volumes:
      - type: volume
        source: secrets
        target: /run/secrets/demo
        read_only: true
        volume:
          subpath: demo
          nocopy: true
    depends_on:
      keygen:
        condition: service_completed_successfully
    networks: [backend]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  seed:
    <<: *api-image
    profiles: [demo]
    command: ["node", "--enable-source-maps", "dist/seed.js"]
    environment:
      <<: *server-env
      # Runs only when explicitly enabled; idempotent (safe on every `up`).
      OCSO_DEMO_SEED: ${OCSO_DEMO_SEED:-false}
      # Reads the audit store only (the seed marker): the reader, like the api.
      AUDIT_DATABASE_URL: ${AUDIT_READER_URL:-}
      AUDIT_DATABASE_URL_FILE: /run/secrets/ocso/audit_reader_url
      OCSO_DEMO_PASSWORD: ${OCSO_DEMO_PASSWORD:-}
      MCP_DEMO_URL: ${MCP_DEMO_URL:-http://mcp-bank-demo:8080/mcp}
      DEMO_MCP_TOKEN: ${DEMO_MCP_TOKEN:-}
      DEMO_MCP_TOKEN_FILE: /run/secrets/ocso/demo_mcp_token
    volumes:
      - *app-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      mcp-bank-demo:
        condition: service_healthy
    networks: [backend]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *logging

  # ── profile: observability ───────────────────────────────────────────────────
  otel-collector:
    profiles: [observability]
    image: ${OCSO_OTELCOL_IMAGE:-otel/opentelemetry-collector-contrib:0.161.0}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
    networks: [backend, default]
    restart: unless-stopped
    logging: *logging

  jaeger:
    profiles: [observability]
    image: ${OCSO_JAEGER_IMAGE:-jaegertracing/jaeger:2.21.0}
    ports:
      - "127.0.0.1:${OCSO_JAEGER_UI_PORT:-16686}:16686"
    networks: [backend, default]
    restart: unless-stopped
    logging: *logging

  # ── profile: s3 ──────────────────────────────────────────────────────────────
  seaweedfs:
    profiles: [s3]
    image: ${OCSO_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - s3data:/data
      - type: volume
        source: secrets
        target: /etc/seaweedfs
        read_only: true
        volume:
          subpath: seaweedfs
          nocopy: true
    depends_on:
      keygen:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  # Creates the media bucket once (idempotent).
  s3-init:
    profiles: [s3]
    image: ${OCSO_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    entrypoint: ["/bin/sh", "-c", 'echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=seaweedfs:9333']
    environment:
      S3_BUCKET: ${S3_BUCKET:-ocso-media}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks: [backend]
    restart: "no"
    logging: *logging

volumes:
  pgdata:
  auditdata:
  blobs:
  secrets:
  s3data:

networks:
  # Default network: published ports and outbound access (model providers,
  # channel APIs, public MCP servers) for web/api/worker.
  default: {}
  # PostgreSQL and in-cluster dependencies: no outbound internet.
  backend:
    internal: true
